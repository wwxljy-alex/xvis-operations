# AutoJob 配置文件

## 数据库
database:
  path: "/home/ubuntu/clawd/auto_job/data/autojob.db"

## 日志
logging:
  level: "INFO"
  file: "/home/ubuntu/clawd/auto_job/logs/autojob.log"

## 浏览器设置
browser:
  headless: false  # 生产环境设为true
  timeout: 30000
  implicit_wait: 10

## 代理设置
proxy:
  enabled: false
  pool: []

## 投递设置
application:
  delay_min: 5000  # ms
  delay_max: 12000  # ms
  max_retries: 3
  retry_wait: 60000

## LLM设置 (填写你的API Key)
llm:
  provider: "minimax"  # openai 或 minimax
  model: "MiniMax-M2.5"
  api_key: ""  # 在这里填写你的API Key
  temperature: 0.7

## 平台配置
platforms:
  boss:
    enabled: true
  lagou:
    enabled: false
  liepin:
    enabled: false
  jobsdb:
    enabled: false
  linkedin:
    enabled: false

## 用户设置 (根据你的需求修改)
user:
  resume_path: "/home/ubuntu/clawd/auto_job/data/resume.pdf"
  keywords:
    - "Web3"
    - "产品经理"
    - "BD"
    - "Business Development"
  locations:
    - "深圳"
    - "香港"
  salary_min: 20  # K/月
  salary_max: 50   # K/月
  experience_min: 1  # 年

## 通知设置
notification:
  telegram:
    enabled: false
    token: ""
    chat_id: ""
